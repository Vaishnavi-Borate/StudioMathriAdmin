<!DOCTYPE html>
<html>
<head>

    <title>Studio Mathri Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">
        📊 Studio Mathri Dashboard
    </h2>

    <div class="row">

        <div class="col-md-3 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h5>🌍 Countries</h5>
                    <h2>{{ countries }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h5>🗺 States</h5>
                    <h2>{{ states }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h5>🏙 Cities</h5>
                    <h2>{{ cities }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-3 mb-3">
            <div class="card shadow">
                <div class="card-body">
                    <h5>📍 Areas</h5>
                    <h2>{{ areas }}</h2>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
